<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Detailed Terraform network module resource flow</title>
  <desc id="description">Shows every network module resource and the references that connect VPC, gateways, subnets, route tables, routes, associations, and module outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L11 6 L1 11 Z" fill="#334155"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#52627a}.head{font-size:18px;font-weight:700}.res{font-size:12px;fill:#52627a}.body{font-size:13px}.small{font-size:12px;fill:#52627a}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.pill{fill:#fff;stroke:#cbd5e1;stroke-width:1.3}.pilltext{font-size:11px;fill:#52627a}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f6f8fb"/>
  <text class="title" x="800" y="48" text-anchor="middle">Network module — resource deployment flow</text>
  <text class="subtitle" x="800" y="78" text-anchor="middle">Three public/private subnet pairs share one VPC; routes connect the tiers to the Internet and NAT gateways.</text>

  <rect x="275" y="120" width="1280" height="790" rx="22" fill="#fff" fill-opacity=".35" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="small" x="300" y="148">VPC boundary — aws_vpc.this</text>

  <path class="line" d="M245 490 H300"/>
  <path class="line" d="M500 455 H485 V275 H510"/>
  <path class="line" d="M500 480 H510"/>
  <path class="line" d="M500 500 H485 V700 H510"/>
  <path class="line" d="M500 500 H475 V800 H510"/>
  <path class="line" d="M500 500 H470 V640 H860"/>
  <path class="line" d="M710 275 H760 V400 H860"/>
  <path class="line" d="M710 275 H775 V320 H1120"/>
  <path class="line" d="M710 545 H760 V530 H1120"/>
  <path class="line" d="M710 545 H770 V320 H1120"/>
  <path class="line" d="M710 700 H800 V815 H1120"/>
  <path class="line" d="M710 800 H820 V400 H860"/>
  <path class="line" d="M710 800 H760 V815 H860"/>
  <path class="line" d="M1060 400 H1120"/>
  <path class="line" d="M1060 640 H1120"/>
  <path class="line" d="M1060 800 H1120"/>
  <path class="line" d="M1060 185 H1100 V320 H1120"/>
  <path class="line" d="M1235 370 V610"/>

  <g>
    <rect x="45" y="410" width="200" height="200" rx="16" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="145" cy="450" r="19" fill="#e9d5ff" stroke="#8b5cf6"/>
    <text x="145" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">IN</text>
    <text class="head" x="145" y="495" text-anchor="middle">Module inputs</text>
    <text class="body" x="68" y="530">vpc_cidr</text>
    <text class="body" x="68" y="554">availability_zones</text>
    <text class="body" x="68" y="578">name_prefix</text>
  </g>
  <g>
    <rect x="300" y="430" width="200" height="100" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text class="head" x="400" y="464" text-anchor="middle">VPC</text>
    <text class="res" x="400" y="485" text-anchor="middle">aws_vpc.this</text>
    <text class="body" x="320" y="512">CIDR boundary; DNS enabled</text>
  </g>
  <g>
    <rect x="510" y="220" width="200" height="110" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text class="head" x="610" y="254" text-anchor="middle">Internet Gateway</text>
    <text class="res" x="610" y="275" text-anchor="middle">aws_internet_gateway.this</text>
    <text class="body" x="530" y="305">Connects public routing</text>
  </g>
  <g>
    <rect x="510" y="490" width="200" height="110" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text class="head" x="610" y="524" text-anchor="middle">Public subnets</text>
    <text class="res" x="610" y="545" text-anchor="middle">aws_subnet.public</text>
    <text class="body" x="530" y="575">3 AZs, /24, public IP map</text>
  </g>
  <g>
    <rect x="510" y="645" width="200" height="110" rx="15" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <text class="head" x="610" y="679" text-anchor="middle">Private subnets</text>
    <text class="res" x="610" y="700" text-anchor="middle">aws_subnet.private</text>
    <text class="body" x="530" y="730">3 AZs, /24, no public IP</text>
  </g>
  <g>
    <rect x="510" y="755" width="200" height="90" rx="15" fill="#fff1db" stroke="#f59e0b" stroke-width="2"/>
    <text class="head" x="610" y="787" text-anchor="middle">Public route table</text>
    <text class="res" x="610" y="808" text-anchor="middle">aws_route_table.public</text>
    <text class="small" x="610" y="831" text-anchor="middle">VPC route container</text>
  </g>
  <g>
    <rect x="860" y="350" width="200" height="100" rx="15" fill="#fff1db" stroke="#f59e0b" stroke-width="2"/>
    <text class="head" x="960" y="383" text-anchor="middle">Public internet route</text>
    <text class="res" x="960" y="404" text-anchor="middle">aws_route.public_internet</text>
    <text class="small" x="960" y="430" text-anchor="middle">0.0.0.0/0 → IGW</text>
  </g>
  <g>
    <rect x="1120" y="465" width="230" height="120" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text class="head" x="1235" y="498" text-anchor="middle">Public associations</text>
    <text class="res" x="1235" y="519" text-anchor="middle">aws_route_table_association.public</text>
    <text class="body" x="1140" y="548">Public subnet → public table</text>
    <text class="small" x="1140" y="572">one association per AZ subnet</text>
  </g>
  <g>
    <rect x="860" y="140" width="200" height="90" rx="15" fill="#fff1db" stroke="#f59e0b" stroke-width="2"/>
    <text class="head" x="960" y="172" text-anchor="middle">NAT Elastic IP</text>
    <text class="res" x="960" y="193" text-anchor="middle">aws_eip.nat</text>
    <text class="small" x="960" y="216" text-anchor="middle">stable public IPv4</text>
  </g>
  <g>
    <rect x="860" y="590" width="200" height="100" rx="15" fill="#fff1db" stroke="#f59e0b" stroke-width="2"/>
    <text class="head" x="960" y="623" text-anchor="middle">Private route table</text>
    <text class="res" x="960" y="644" text-anchor="middle">aws_route_table.private</text>
    <text class="small" x="960" y="670" text-anchor="middle">VPC route container</text>
  </g>
  <g>
    <rect x="860" y="755" width="200" height="90" rx="15" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <text class="head" x="960" y="787" text-anchor="middle">Private associations</text>
    <text class="res" x="960" y="808" text-anchor="middle">aws_route_table_association.private</text>
    <text class="small" x="960" y="831" text-anchor="middle">one per private subnet</text>
  </g>
  <g>
    <rect x="1120" y="270" width="230" height="100" rx="15" fill="#fff1db" stroke="#f59e0b" stroke-width="2"/>
    <text class="head" x="1235" y="303" text-anchor="middle">NAT Gateway</text>
    <text class="res" x="1235" y="324" text-anchor="middle">aws_nat_gateway.this</text>
    <text class="body" x="1140" y="350">first public subnet; needs IGW</text>
  </g>
  <g>
    <rect x="1120" y="610" width="230" height="100" rx="15" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <text class="head" x="1235" y="643" text-anchor="middle">Private NAT route</text>
    <text class="res" x="1235" y="664" text-anchor="middle">aws_route.private_nat</text>
    <text class="small" x="1235" y="689" text-anchor="middle">0.0.0.0/0 → NAT Gateway</text>
  </g>
  <g>
    <rect x="1120" y="765" width="230" height="100" rx="15" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <text class="head" x="1235" y="798" text-anchor="middle">Private subnet associations</text>
    <text class="res" x="1235" y="819" text-anchor="middle">aws_route_table_association.private</text>
    <text class="small" x="1235" y="844" text-anchor="middle">Private subnet → private route table</text>
  </g>
  <g>
    <rect x="1380" y="430" width="150" height="200" rx="15" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text class="head" x="1455" y="468" text-anchor="middle">Outputs</text>
    <text class="res" x="1455" y="490" text-anchor="middle">outputs.tf</text>
    <text class="body" x="1400" y="530">VPC ID</text>
    <text class="body" x="1400" y="558">Public subnet IDs</text>
    <text class="body" x="1400" y="586">Private subnet IDs</text>
    <text class="small" x="1400" y="615">Consumed by other modules</text>
  </g>

  <g>
    <rect class="pill" x="735" y="365" width="112" height="24" rx="12"/><text class="pilltext" x="791" y="382" text-anchor="middle">IGW reference</text>
    <rect class="pill" x="735" y="512" width="112" height="24" rx="12"/><text class="pilltext" x="791" y="529" text-anchor="middle">subnet + table</text>
    <rect class="pill" x="735" y="675" width="112" height="24" rx="12"/><text class="pilltext" x="791" y="692" text-anchor="middle">subnet + table</text>
    <rect class="pill" x="1067" y="237" width="105" height="24" rx="12"/><text class="pilltext" x="1119" y="254" text-anchor="middle">EIP + subnet</text>
    <rect class="pill" x="1067" y="585" width="105" height="24" rx="12"/><text class="pilltext" x="1119" y="602" text-anchor="middle">NAT ID</text>
  </g>
  <text class="small" x="45" y="942">For each of the three AZs: one public and one private /24 subnet. One NAT Gateway is placed in the first configured public subnet.</text>
  <text class="small" x="45" y="966">Solid arrows show resource references or dependencies; route-table associations attach each subnet to its tier's routing table.</text>
</svg>
